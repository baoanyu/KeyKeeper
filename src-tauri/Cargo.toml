[package]
name = "keykeeper"
version = "0.1.0"
description = "macOS 多平台 API 配额聚合器"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-store = "2.1"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
anyhow = "1.0"
keyring = "3.0"
futures = "0.3"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
